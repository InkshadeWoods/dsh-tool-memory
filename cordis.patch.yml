# dsh-tool-memory 组合包：向 profile 插入插件行。

# 安装后按包名引用，Node 从 node_modules 解析到预构建的 lib/index.js。
- insert:
    - id: memory
      name: dsh-tool-memory
      config:
        # root: ''                # 记忆文件目录；默认 $DSH_HOME/memories（DSH_HOME 或 ~/.dsh）
        # memoryCharLimit: 2200   # MEMORY.md 字符预算（按字符计数，与模型无关）
        # userCharLimit: 1375     # USER.md 字符预算
        # injectionMode: 'snapshot' # snapshot=传统冻结快照；recall=智能动态召回
        # recallTopK: 6             # 智能模式召回条数上限；实际注入=min(本值, 记忆文件总条数, 本轮门控通过数)
        # recallMaxChars: 0         # 智能模式动态记忆总字符上限；0=不设上限（默认，零截断）
        # recallPerItemChars: 0     # 智能模式单条记忆字符上限；0=不设上限（默认，单条零截断）
        # recallEmbeddingEnabled: false # 语义 embedding 增强；默认关闭，需手动开启
        # recallEmbeddingBaseUrl: 'http://127.0.0.1:1234/v1' # OpenAI 兼容 embedding API 根地址；默认本机 LM Studio，无需鉴权
        # recallEmbeddingApiKey: ''    # 仅远端端点需要；只保存在本机，不要提交或共享此配置文件
        # recallEmbeddingModel: 'text-embedding-qwen3-embedding-0.6b' # embedding 模型标识
